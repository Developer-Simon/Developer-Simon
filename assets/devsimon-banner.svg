<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="title desc">
  <title id="title">DevSimon — energy · iot · automation</title>
  <desc id="desc">Die Initialen D und S als Automatisierungs-Flow: ein Trigger startet den Fluss durch das D, eine Bedingung verbindet ihn mit dem S, das in einer Aktion endet.</desc>
  <style>
    :root {
      --fg: #1f2328; --muted: #656d76; --edge: #0969da; --pad: #ffffff;
      --energy: #d4a017; --ok: #1a7f37; --grid: #d8dee4;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #e6edf3; --muted: #8d96a0; --edge: #58a6ff; --pad: #0d1117;
        --energy: #f2c744; --ok: #3fb950; --grid: #262c34;
      }
    }
    .grid  { fill: var(--grid); }
    .edge  { fill: none; stroke: var(--edge); stroke-width: 7; stroke-linecap: round; }
    .link  { fill: none; stroke: var(--edge); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 2 8; opacity: .8; }
    .pulse { fill: none; stroke: var(--energy); stroke-width: 7; stroke-linecap: round;
             stroke-dasharray: 5 95; animation: flow 3.2s linear infinite; }
    .d2 { animation-delay: -1.1s; } .d3 { animation-delay: -2.2s; }
    .node  { fill: var(--pad); stroke: var(--edge); stroke-width: 4; }
    .trig  { fill: var(--energy); }
    .cond  { fill: var(--pad); stroke: var(--energy); stroke-width: 4; }
    .act   { fill: var(--ok); }
    .glyph { fill: none; stroke: var(--pad); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    .bolt  { fill: var(--pad); stroke: var(--pad); stroke-width: 1; stroke-linejoin: round; }
    .tag   { fill: var(--muted); font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .name  { fill: var(--fg); font: 700 64px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: -1px; }
    .sub   { fill: var(--muted); font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hint  { fill: var(--muted); font: 500 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .dot   { fill: var(--energy); }
    @keyframes flow { from { stroke-dashoffset: 100; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .pulse { display: none; } }
  </style>

  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle class="grid" cx="10" cy="10" r="1.2"/>
    </pattern>
  </defs>
  <rect width="880" height="300" fill="url(#dots)"/>

  <g transform="translate(20 20)">
    <!-- D: Stamm + Bauch -->
    <path class="edge" d="M70 40 V220"/>
    <path class="edge" d="M70 40 C180 40 200 90 200 130 C200 170 180 220 70 220"/>
    <!-- Verbindung D → S -->
    <path class="link" d="M200 130 C240 130 240 85 270 85"/>
    <!-- S -->
    <path class="edge" d="M380 60 C340 30 270 35 270 85 C270 130 380 120 380 175 C380 230 300 235 262 200"/>

    <!-- Datenpakete -->
    <path class="pulse" pathLength="100" d="M70 40 V220"/>
    <path class="pulse d2" pathLength="100" d="M70 40 C180 40 200 90 200 130 C200 170 180 220 70 220"/>
    <path class="pulse" pathLength="100" d="M270 85 C270 130 380 120 380 175 C380 230 300 235 262 200"/>
    <path class="pulse d3" pathLength="100" d="M270 85 C270 35 340 30 380 60"/>

    <!-- Knoten -->
    <rect class="node" x="60" y="120" width="20" height="20" rx="5"/>
    <rect class="node" x="60" y="210" width="20" height="20" rx="5"/>
    <rect class="node" x="166" y="60" width="20" height="20" rx="5"/>
    <rect class="node" x="166" y="180" width="20" height="20" rx="5"/>
    <rect class="node" x="370" y="50" width="20" height="20" rx="5"/>
    <rect class="node" x="315" y="116" width="20" height="20" rx="5"/>
    <rect class="node" x="370" y="165" width="20" height="20" rx="5"/>
    <rect class="node" x="260" y="75" width="20" height="20" rx="5"/>

    <!-- Trigger (Blitz) -->
    <circle class="trig" cx="70" cy="40" r="17"/>
    <path class="bolt" d="M73 28 L62 43 H69 L67 52 L78 37 H71 Z"/>
    <!-- Bedingung (Raute) -->
    <path class="cond" d="M200 116 L214 130 L200 144 L186 130 Z"/>
    <!-- Aktion (Haken) -->
    <rect class="act" x="246" y="186" width="30" height="30" rx="8"/>
    <path class="glyph" d="M254 201 L259 207 L269 195"/>

    <!-- Beschriftung -->
    <text class="tag" x="94" y="30">trigger</text>
    <text class="tag" x="222" y="152">if</text>
    <text class="tag" x="286" y="238">action</text>
  </g>

  <g transform="translate(470 0)">
    <text class="hint" x="0" y="90">trying to improve life,<tspan x="0" dy="20">one automation at a time</tspan></text>
    <text class="name" x="-4" y="172">DevSimon</text>
    <text class="sub" x="0" y="210">energy <tspan class="dot">·</tspan> iot <tspan class="dot">·</tspan> automation</text>
  </g>
</svg>
